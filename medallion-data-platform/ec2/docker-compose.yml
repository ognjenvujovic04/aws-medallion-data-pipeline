# Serving host: PostgreSQL (analytics store) + Apache Superset (dashboards).
#
# Values come from /opt/serving/.env, which docker compose auto-loads from this
# directory. ServingStack writes that .env from CDK context (db_password, etc.).
# Run from /opt/serving with `docker compose up -d` (see ec2/user_data.sh).

services:
  postgres:
    image: postgres:16
    container_name: serving-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Applied once on first init (empty volume). Creates the 6 gold tables.
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      # Reachable in-VPC by the GoldToPostgres lambda (postgres_sg allows 5432
      # from lambda_sg). Not exposed publicly — no 5432 ingress for any other peer.
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${DB_USER} -d $${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 12

  superset:
    image: apache/superset:3.1.3
    container_name: serving-superset
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SUPERSET_LOAD_EXAMPLES: "no"
      ADMIN_USERNAME: ${SUPERSET_ADMIN_USER}
      ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}
    # Self-initialize so the container is reproducible and self-healing on restart.
    # All three steps are idempotent; create-admin is tolerant if the user exists.
    command:
      - bash
      - -c
      - |
        superset db upgrade
        superset fab create-admin \
          --username "$${ADMIN_USERNAME}" \
          --firstname Admin --lastname User \
          --email admin@example.com \
          --password "$${ADMIN_PASSWORD}" || true
        superset init
        /usr/bin/run-server.sh
    ports:
      - "8088:8088"
    volumes:
      - superset_home:/app/superset_home

  # One-shot: provision the datasource, datasets, charts, and 4 dashboards by code
  # (superset_bootstrap.py) once Superset is serving. Idempotent, so re-running
  # `docker compose up` is safe; `restart: "no"` keeps it from looping. Reuses the
  # Superset image purely for its Python + `requests` — it only makes HTTP calls.
  superset-init:
    image: apache/superset:3.1.3
    container_name: serving-superset-init
    restart: "no"
    depends_on:
      - superset
    environment:
      SUPERSET_URL: http://superset:8088
      SUPERSET_ADMIN_USER: ${SUPERSET_ADMIN_USER}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./superset_bootstrap.py:/app/superset_bootstrap.py:ro
    entrypoint: [""]
    command: ["python", "/app/superset_bootstrap.py"]

volumes:
  pgdata:
  superset_home:
